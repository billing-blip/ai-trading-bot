name: trading-bot

# Started on time by cron-job.org (see SETUP.md). The `schedule` entries below are only a
# backup — GitHub's own timer is often late, and every job is safe to run twice.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "snapshot | activate | tick | eod | status"
        required: true
        default: tick
  schedule:
    - cron: "30 2 * * 1-5"    # 08:00 IST snapshot
    - cron: "40 3 * * 1-5"    # 09:10 IST activate
    - cron: "20 4-8 * * 1-5"  # 09:50 .. 13:50 IST tick
    - cron: "5 9 * * 1-5"     # 14:35 IST tick
    - cron: "50 9 * * 1-5"    # 15:20 IST tick
    - cron: "30 10 * * 1-5"   # 16:00 IST eod

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide which job
        id: job
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            case "${{ github.event.schedule }}" in
              "30 2 * * 1-5") JOB=snapshot ;;
              "40 3 * * 1-5") JOB=activate ;;
              "30 10 * * 1-5") JOB=eod ;;
              *) JOB=tick ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running: $JOB"

      - name: Run bot
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m bot.cli ${{ steps.job.outputs.job }}

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -A state data plans reports || true
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "bot: ${{ steps.job.outputs.job }} $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 7; done
          exit 1
