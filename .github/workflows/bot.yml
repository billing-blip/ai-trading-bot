name: trading-bot

# Momentum mode: ONE job per trading day after the close ("daily"). GitHub's timer is often
# late, which is fine: the job catches up any missed days by itself and is safe to run twice.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "daily | status  (swing-mode jobs: snapshot | activate | tick | eod)"
        required: true
        default: daily
  schedule:
    - cron: "35 10 * * 1-5"   # 16:05 IST daily run
    - cron: "5 14 * * 1-5"    # 19:35 IST backup (does nothing if already done)

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide which job
        id: job
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            JOB=daily
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running: $JOB"

      - name: Run bot
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m bot.cli ${{ steps.job.outputs.job }}

      - name: Update dashboard data
        if: always()
        run: python -m bot.export_dashboard || true

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -A state data plans reports || true
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "bot: ${{ steps.job.outputs.job }} $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 7; done
          exit 1
