# Days with big scheduled events: NO new trades (rulebook section 3).
# Add Budget day, RBI policy announcement days and election result days here.
# The morning AI is also told to declare "no_trade" on such days if it finds them in the news.
no_trade_days:
  - 2027-02-01   # Union Budget

# Stocks blocked for a date range (e.g. company results). The morning AI also removes
# stocks with results within 2 days using news, this list is a manual backup.
# format:  SYMBOL: [start_date, end_date]
blackout: {}
